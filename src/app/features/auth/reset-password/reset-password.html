<div [attr.data-theme]="themeService.currentTheme()" class="min-h-screen bg-base-100 font-sans transition-colors duration-300 flex items-center justify-center p-6">
  <div class="fixed top-6 right-6 z-50">
    <button 
      (click)="themeService.toggleDarkMode()" 
      class="btn btn-ghost btn-circle bg-base-200/50 backdrop-blur-md hover:bg-base-200 transition-all border border-base-content/10"
    >
      <lucide-icon [name]="themeService.darkMode() ? 'sun' : 'moon'" size="20" class="text-base-content"></lucide-icon>
    </button>
  </div>

  <div class="w-full max-w-[400px] bg-base-100/50 backdrop-blur-xl p-8 rounded-3xl border border-base-200 shadow-2xl space-y-8">
    
    <div class="flex flex-col items-center gap-3">
      <img
        [src]="themeService.logoUrl()"
        alt="InfinyCapital"
        class="h-10 w-auto object-contain"
      />
      <h2 class="text-xl font-black tracking-[0.1em] text-primary uppercase leading-none">
        InfinyCapital
      </h2>
    </div>

    <div>
      <h1 class="text-2xl text-center font-black tracking-tight text-base-content">
        Nueva Contraseña
      </h1>
      <p class="mt-2 text-sm text-center text-base-content/75">
        Ingresa el código que recibiste y tu nueva contraseña.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      @if (errorMessage()) {
        <div class="alert alert-error py-2 px-4 text-[13px] font-bold text-white rounded-lg animate-in fade-in duration-300">
          <lucide-icon name="alert-circle" size="16"></lucide-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }
      @if (successMessage()) {
        <div class="alert alert-success py-2 px-4 text-[13px] font-bold text-white rounded-lg animate-in fade-in duration-300">
          <lucide-icon name="check-circle" size="16"></lucide-icon>
          <span>{{ successMessage() }}</span>
        </div>
      }

      <div class="flex flex-col gap-1.5 hidden">
        <input type="email" formControlName="email" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="px-1 text-sm font-black tracking-widest text-base-content/55">
          Código de Verificación
        </label>
        <label class="input input-bordered flex h-11 w-full items-center gap-3 bg-base-200/20 px-4 transition-all duration-200 focus-within:border-primary focus-within:outline-none">
          <lucide-icon name="key" size="16" class="text-base-content/30"></lucide-icon>
          <input 
            type="text" 
            formControlName="codigo" 
            class="grow bg-transparent text-sm font-medium tracking-widest focus:outline-none" 
            placeholder="123456" 
            maxlength="6"
          />
        </label>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="px-1 text-sm font-black tracking-widest text-base-content/55">
          Nueva Contraseña
        </label>
        <label class="input input-bordered flex h-11 w-full items-center gap-3 bg-base-200/20 px-4 transition-all duration-200 focus-within:border-primary focus-within:outline-none">
          <lucide-icon name="lock" size="16" class="text-base-content/30"></lucide-icon>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="nuevaContrasena" 
            class="grow bg-transparent text-sm font-medium placeholder:font-normal placeholder:text-base-content/30 focus:outline-none" 
            placeholder="••••••••" 
          />
          <button 
            type="button" 
            (click)="togglePassword()" 
            class="btn btn-ghost btn-xs btn-circle text-base-content/30 hover:text-primary transition-colors"
          >
            <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" size="16"></lucide-icon>
          </button>
        </label>
      </div>

      <div class="flex flex-col gap-4">
        <button 
          type="submit" 
          [disabled]="form.invalid || isLoading()"
          class="btn btn-primary h-11 w-full min-h-[2.75rem] text-[13px] font-black tracking-widest shadow-md transition-all active:scale-[0.98] disabled:bg-base-200 disabled:text-base-content/20 disabled:shadow-none"
        >
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
            Procesando...
          } @else {
            Restablecer Contraseña
          }
        </button>
        <a 
          routerLink="/login"
          class="btn btn-ghost h-11 w-full min-h-[2.75rem] text-[13px] font-bold tracking-widest"
        >
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
